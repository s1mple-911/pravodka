<!-- ⚠️ BU SAHIFADA 5 ta <script> (boshqa dev sahifalarda 4-5, lekin bu boshqacha):
     lucide + supabase + perms-dev + SHU INLINE + module. Inline skript ATAYLAB
     `defer` EMAS va module ham emas — u BIRINCHI KADRDAN oldin ishlashi kerak.

     Nima qiladi va nega:
       1) Sessiya tokeni bor-yo'qligiga qarab <html> ga `has-sess`/`no-sess` klassi.
          Sababi: #gate va #dash ikkalasi ham sukut bo'yicha `display:none` —
          module yiqilsa (vendor 404, tarmoq, kelajakdagi xato) domen ILDIZI
          butunlay OQ qolardi. Bu klass hech bo'lmaganda to'g'ri ekranni ochadi.
          Module baribir keyin aniq holatni `style.display` bilan qo'yadi.
       2) Mavzuni (prov-theme) shu yerda qo'llaydi — module ichida qo'llansa
          dark foydalanuvchi bir kadr oq ekran ko'rardi (index — birinchi yuz).
     localStorage bloklangan brauzerda (Safari private) — `no-sess`, ya'ni login. -->
<script>
(function(){
  var d=document.documentElement, t=null, th=null;
  try{ t=localStorage.getItem('sb-kxzerccdpcltmzrxutlo-auth-token'); th=localStorage.getItem('prov-theme'); }catch(e){}
  d.classList.add(t?'has-sess':'no-sess');
  if(th==='dark') d.setAttribute('data-theme','dark');
})();
</script>
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('vendor/inter.woff2') format('woff2')}
  /* ================= DIZAYN TOKENLARI (hodim-dev.html bilan bir xil) =================
     BREND: Aros yashil #1ea83a. Uch pog'ona — hammasi bir tus:

  :root{
    --bg:#f5f6f8;--surface:#fff;--surface-2:#f0f2f5;--surface-3:#e7eaef;

  #gate{display:none}

  /* …lekin module umuman ishga tushmasa (vendor 404, xato) oq ekran qolardi.

  .no-sess #gate{display:flex}

<script type="module">
const SUPABASE_URL='https://kxzerccdpcltmzrxutlo.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_meO8FlGtAz1hmwNrrrgI6Q_PBh0T1rT';

const $=id=>document.getElementById(id);
const icons=()=>{ if(window.lucide) lucide.createIcons(); };

/* ---- Mavzu — boshqa sahifalar bilan AYNAN bir xil kalit (prov-theme) ---- */
function syncThemeIcon(){ const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.querySelectorAll('button[onclick="toggleTheme()"] [data-lucide]').forEach(el=>el.setAttribute('data-lucide',dark?'sun':'moon')); icons(); }

/* ================= LOGIN ================= */
/* Xato matni O'ZBEKCHA va umumiy — xom Supabase matni foydalanuvchiga
   ko'rsatilmaydi (inglizcha va ichki tafsilot sizdiradi), lekin console.error
   ga to'liq yoziladi: qo'llab-quvvatlash uchun kerak. */
function loginErrText(e){
  const m=String((e&&(e.message||e.error_description))||'');
  const st=Number(e&&e.status)||0;
  if(/invalid.?login|invalid.?credentials|invalid.?grant/i.test(m)) return 'Email yoki parol noto\'g\'ri';
  if(/email not confirmed/i.test(m)) return 'Email tasdiqlanmagan — administratorga murojaat qiling';
  if(/too many|rate limit/i.test(m)||st===429) return 'Juda ko\'p urinish. Bir daqiqadan keyin qayta urinib ko\'ring';
  if(/user not found/i.test(m)) return 'Bunday foydalanuvchi topilmadi';
  if(/failed to fetch|network|load failed|timeout|aborted/i.test(m)||st===0)
    return 'Internetga ulanmadi. Aloqani tekshirib, qayta urinib ko\'ring';
  return 'Kirishda xato yuz berdi. Qayta urinib ko\'ring';
}
function setErr(t){ $('authErr').textContent=t||''; }
/* So'rov ketayotganda tugma ham, maydonlar ham bloklanadi (ikki marta yuborilmasin). */
function setBusy(b){
  $('loginBtn').disabled=b; $('loginBtn').textContent=b?'Kirilmoqda…':'Kirish';
  $('email').disabled=b; $('password').disabled=b;
}
/* Xatodan keyin fokus AYBDOR maydonga qaytadi — user qayerni tuzatishni bilsin. */
function focusFor(e){
  const m=String((e&&e.message)||'');
  if(/user not found/i.test(m)){ $('email').focus(); $('email').select(); return; }
  $('password').focus(); $('password').select();
}
async function onLogin(ev){
  ev.preventDefault();                       // <form> — Enter ishlaydi, sahifa qayta yuklanmaydi
  const email=$('email').value.trim(), password=$('password').value;
  setErr('');
  if(!email){ setErr('Email kiriting'); $('email').focus(); return; }
  if(!password){ setErr('Parolni kiriting'); $('password').focus(); return; }
  setBusy(true);
  let res;
  /* supabase-js {data,error} qaytaradi (throw QILMAYDI) — error MAJBURIY tekshiriladi.
     try/catch esa faqat tarmoq/DNS darajasidagi istisno uchun (fetch reject). */
  try{ res=await sb.auth.signInWithPassword({email,password}); }
  catch(ex){ res={error:ex}; }
  if(res.error){
    console.error('Login xato:',res.error);
    setBusy(false); setErr(loginErrText(res.error)); focusFor(res.error);
    return;
  }
  setBusy(false); setErr('');
  /* permClear() MAJBURIY: sessionStorage'dagi eski ruxsatlar reload'siz ham
     qolib ketadi — yangi foydalanuvchi eskisining ruxsati bilan ochilmasin.
     swrClear() ham shart: boshqa foydalanuvchi O'SHA TABDA kirsa (chiqishsiz —
     masalan sessiya tugagach) eskisining raqamlari keshda qolib ketardi. */
  window.permClear(); swrClear();
  $('password').value='';
  /* 🔴 RELOAD (2026-08-18 prod bug tuzatishi). Avval `enterApp()` chaqirilardi, ya'ni
     `my_perms()` login'dan keyin DARROV yuborilardi — supabase-js esa Authorization
     sarlavhasini asinxron `SIGNED_IN` hodisasida yangilaydi, shuning uchun o'sha birinchi
     so'rov ANON kalit bilan ketib xato qaytarardi va dashboard hamma bo'limni ko'rsatardi
     (F5 dan keyin to'g'rilanardi). Reload — foydalanuvchi qo'lda bosadigan F5 ning o'zi:
     klient token bilan ishga tushadi, poyga umuman qolmaydi. Token allaqachon
     localStorage'da (signInWithPassword qaytishidan oldin yoziladi), shuning uchun
     <head> dagi inline skript darrov `has-sess` qo'yadi — login ekrani miltillamaydi.
     ⚠️ perms.js dagi qayta urinish va dashboardning fail-closed rendering'i baribir
     saqlanadi: ular boshqa yo'llarni (kesh, boshqa tab, sekin tarmoq) qoplaydi. */
  location.reload();
}

/* ================= DASHBOARD ================= */
/* Kartalar. `href` ATAYLAB to'liq literal ('jurnal-dev.html') — promote.sh faqat
   literal `NAME-dev.html` matnini `NAME.html` ga almashtiradi. Havolani JS'da
   `k+'-dev.html'` deb yig'sak, prod nusxa dev fayllarga havola qilib qolardi. */
const HODIM={k:'hodim',href:'hodim-dev.html',t:'Xarajat kiritish',i:'wallet',d:'Hodim xarajatini kiritish'};
const CARDS=[
  {k:'jurnal',       href:'jurnal-dev.html',       t:'Jurnal',              i:'scroll-text',      d:'Provodkalar tarixi, filtr, tahrir'},
  {k:'professional', href:'professional-dev.html', t:'Professional',        i:'list-plus',        d:"Ko'p satrli qo'lda yozuv"},

  {k:'cashflow',     href:'cashflow-dev.html',     t:'Cashflow',            i:'waves',            d:'Pul oqimi: kirim va chiqim'},
  {k:'qarzdor',      href:'qarzdor-dev.html',      t:'Qarz',                i:'hand-coins',       d:'Debitor va kreditor qarzlar'},
  {k:'filial',       href:'filial-dev.html',       t:'Filial',              i:'store',            d:'Filiallardagi jonli pul'},
  {k:'valyuta',      href:'valyuta-dev.html',      t:'Valyuta',             i:'banknote',         d:'Valyuta kurslari'},
  {k:'sorovlar',     href:'sorovlar-dev.html',     t:"So'rovlar",           i:'hand-coins',       d:"Pul so'rovlari: tasdiq va rad"},
  {k:'konvert',      href:'konvert-dev.html',      t:'Konvert',             i:'arrow-right-left', d:"Konvert so'rovlari va tasdiq"},
  {k:'sozlama',      href:'sozlama-dev.html',      t:'Sozlamalar',          i:'settings',         d:'Hisob rejasi boshqaruvi'},
  {k:'rollar',       href:'sozlama-dev.html#rollar', t:'Rollar',            i:'shield',           d:'Rollar va foydalanuvchi ruxsatlari'},
  {k:'standart',     href:'standart-dev.html',     t:'Standart xarajatlar', i:'gauge',            d:"Takrorlanuvchi xarajat me'yorlari"},
  {k:'yuklar',       href:'yuklar-dev.html',       t:'Yuklar',              i:'package',          d:'Yuk partiyalari'},
  {k:'tannarx',      href:'tannarx-dev.html',      t:'Tannarx',             i:'receipt-text',     d:'Tovar tannarxi hisobi'},
  {k:'ai',           href:'ai-dev.html',           t:'AI yordamchi',        i:'sparkles',         d:'Moliyaviy savol-javob'}
];
/* `provodka` sahifasi ATAYLAB yo'q: u navigatsiyadan yashirilgan (CLAUDE.md),
   faqat to'g'ridan URL bilan ochiladi.
   `rollar` — bu SAHIFA emas, faqat KARTA (sozlama-dev.html ichidagi bo'lim, "UCH joy"
   qoidasiga kirmaydi: perm_pages()/PAGES da yo'q). renderCards() uni permPageOk()
   BILAN EMAS, to'g'ridan permIsAdmin() bilan filtrlaydi. */

function cardHtml(c){
  return '<a class="pcard" href="'+c.href+'">'
    +'<span class="pico"><i data-lucide="'+c.i+'"></i></span>'
    +'<span class="ptxt"><span class="pt">'+esc(c.t)+'</span><span class="pd">'+esc(c.d)+'</span></span>'
    +'<i class="parr" data-lucide="chevron-right"></i></a>';
}
function renderCards(){
  /* 🔴 FAIL-CLOSED (2026-08-18 prod bug): ruxsat HALI ma'lum bo'lmasa (my_perms()
     javobi kelmagan yoki xato bergan) karta CHIZILMAYDI. perms.js ning "yuklanmaguncha
     ochiq" qoidasi nav uchun to'g'ri, dashboard uchun esa TESKARI natija berardi —
     yangi user hamma bo'limni ko'rib, F5 dan keyin ular yo'qolardi.
     Bosilsa baribir gate() qaytarib yuborardi, ya'ni ro'yxat yolg'on edi. */
  if(window.permLoaded && !window.permLoaded()){ showCardsWait(); return; }
  /* permPageOk() adminni o'zi o'tkazadi (is_admin -> hammasi true) — qo'shimcha
     `is_admin` sharti yozilmaydi, mantiq bitta joyda (perms-dev.js) qolsin. */
  const list=CARDS.filter(c=>{
    // 'rollar' PAGES/perm_pages() da yo'q — permPageOk() hammaga true qaytaradi,
    // shuning uchun bu yerda ALOHIDA, to'g'ridan admin tekshiruvi.
    if(c.k==='rollar') return !!(window.permIsAdmin && window.permIsAdmin());
    if(!window.permPageOk(c.k)) return false;
    if(c.k==='konvert' && !window.permConvert()) return false;   // konvertga QO'SHIMCHA shart
    return true;
  });
  const box=$('cards');
  if(!list.length){
    /* Faqat hodim ochiq (userlarning ~80% i shunday) — bu XATO emas, shuning
       uchun matn mehribon va yo'l ko'rsatadi. */
    box.innerHTML='<div class="pempty">'
      +'<div class="pempty-ico"><i data-lucide="lock"></i></div>'
      +'<h2>Sizga Provodka bo\'limlari ochilmagan</h2>'
      +'<p>Xarajat kiritish uchun quyidagi tugmadan foydalaning. Boshqa bo\'lim kerak bo\'lsa administratorga murojaat qiling.</p>'
      +'<a class="pbtn" href="hodim-dev.html"><i data-lucide="wallet"></i>Xarajat kiritish</a>'
      +'</div>';
    icons(); return;                            // innerHTML'dan keyin ikonkalar qayta chiziladi
  }
  box.innerHTML='<div class="cards-grid">'+[HODIM].concat(list).map(cardHtml).join('')+'</div>';
  icons();
}
/* Ruxsat kelmaguncha ko'rinadigan holat. `permWaited` — perms.js o'z qayta urinishlarini
   tugatgandan keyin ham javob bo'lmasa (tarmoq uzilgan) foydalanuvchi "Yuklanmoqda…" da
   qotib qolmasin: qo'lda "Qayta urinish" tugmasi beriladi. */
let permWaited=false;
function showCardsWait(){
  const box=$('cards'); if(!box) return;
  box.innerHTML = permWaited
    ? '<div class="pempty">'
      +'<div class="pempty-ico"><i data-lucide="wifi-off"></i></div>'
      +'<h2>Ruxsatlar yuklanmadi</h2>'
      +'<p>Internet aloqasi uzilgan bo\'lishi mumkin. Qayta urinib ko\'ring.</p>'
      +'<button type="button" class="pbtn" onclick="retryPerms()"><i data-lucide="refresh-cw"></i>Qayta urinish</button>'
      +'</div>'
    : '<div class="loading">Yuklanmoqda…</div>';
  icons();
}
window.retryPerms=async()=>{
  permWaited=false; showCardsWait();
  try{ await window.permLoad(sb); }catch(e){ console.error('permLoad xato:',e); }
  permWaited=true; renderCards();
};
/* my_perms() javobi kartalar chizilgandan KEYIN yangilanishi mumkin (kesh bilan
   ochilgan holat). ai-widget-dev.js naqshi: 400ms x 20 poll, o'zgargan bo'lsa
   jimgina qayta chizamiz. */
let permsSnap='';
function watchPerms(){
  let n=0;
  const t=setInterval(()=>{
    const cur=JSON.stringify(window.PERMS||{});
    if(cur!==permsSnap){ permsSnap=cur; renderCards(); }
    if(++n>=20) clearInterval(t);
  },400);
}
/* Foydalanuvchi ismi/roli. profiles o'qilmasa (RLS, tarmoq) sahifa BUZILMAYDI —
   email fallback, rol esa PERMS.is_admin dan olinadi. */
async function loadUser(){
  const {data,error}=await sb.auth.getSession();
  if(error) console.error('getSession xato:',error);
  const user=data&&data.session&&data.session.user;
  if(!user) return;
  let full=null, role=null;
  const res=await sb.from('profiles').select('full_name,role').eq('id',user.id).maybeSingle();
  if(res.error) console.error('profiles o\'qilmadi:',res.error);
  else if(res.data){ full=res.data.full_name; role=res.data.role; }
  const nm=String(full||user.email||'');
  $('uname').textContent=nm;
  $('uname').title=user.email||'';
  const admin = role ? role==='admin' : !!(window.PERMS&&window.PERMS.is_admin);
  $('urole').textContent=admin?'Admin':'Foydalanuvchi';
  $('urole').classList.toggle('admin',admin);
  $('uav').textContent=(nm.trim().charAt(0)||'?').toUpperCase();
}

/* ================= EKRANLAR / BOOT ================= */
let appShown=false;
/* Kartalarni boshlang'ich holatga qaytaradi. MAJBURIY: bir tabda foydalanuvchi
   almashganda (sessiya tugadi -> qayta login) eski ro'yxat DOM'da qolib ketardi va
   yangi user `my_perms()` javobigacha ESKISINING kartalarini ko'rar edi
   (`loaded=false` -> permPageOk hammaga `true`). permsSnap ham tozalanadi, aks holda
   watchPerms "o'zgarmadi" deb qayta chizmasdi. */
function resetCards(){
  permsSnap=''; permWaited=false;        // yangi kutish sikli — "Qayta urinish" ekrani qolib ketmasin
  var box=$('cards'); if(box) box.innerHTML='<div class="loading">Yuklanmoqda…</div>';
}
function showLogin(){
  appShown=false;                       // keyingi muvaffaqiyatli login enterApp() ni qayta ochsin
  $('dash').style.display='none';
  $('gate').style.display='flex';
  resetCards();                         // eski user kartalari qolib ketmasin
  syncThemeIcon();
  setBusy(false);
  try{ $('email').focus(); }catch(e){}
}
async function enterApp(){
  if(appShown) return; appShown=true;
  $('gate').style.display='none';
  $('dash').style.display='block';
  resetCards();                         // ruxsat kelguncha "Yuklanmoqda…" (eski ro'yxat emas)
  syncThemeIcon();
  /* Kartalar FAQAT ruxsat ma'lum bo'lgach chiziladi: permPageOk() ruxsat
     yuklanmaguncha `true` qaytaradi (perms-dev.js qoidasi) — busiz bir zumga
     HAMMA karta ko'rinib, keyin yo'qolardi. Keshda ruxsat bo'lsa permLoad
     tarmoqni kutmaydi, ya'ni kechikish sezilmaydi. */
  await Promise.all([
    loadUser(),
    window.permLoad(sb)
      /* permWaited=true — permLoad o'z qayta urinishlarini tugatdi. Shundan keyin ham
         ruxsat kelmagan bo'lsa renderCards() "Qayta urinish" ekranini ko'rsatadi
         (hamma kartani emas). */
      .then(()=>{ permWaited=true; permsSnap=JSON.stringify(window.PERMS||{}); renderCards(); watchPerms(); })
      /* Kutilmagan xato bo'lsa ham dashboard "Yuklanmoqda…" da qotib qolmasin:
         perms-dev.js ning "yuklanmaguncha ochiq" qoidasi bo'yicha kartalar
         chiziladi (haqiqiy to'siq baribir server tomonda). */
      .catch(e=>{ console.error('permLoad xato:',e); permWaited=true; renderCards(); })
  ]);
}
/* 14 sahifa `sessionStorage` ga `prov-swr:<sahifa>:<n>` keshini yozadi va u reload'dan
   keyin ham qoladi. Dashboard endi asosiy chiqish joyi: user A chiqib, user B O'SHA
   TABDA kirsa, kassa/jurnal ochganda bir zumga A ning raqamlarini ko'rardi.
   `hodim-dev.html` dagi swrClear() naqshi. */
function swrClear(){ try{
  Object.keys(sessionStorage).filter(k=>k.indexOf('prov-swr:')===0)
    .forEach(k=>sessionStorage.removeItem(k));
}catch(e){} }
window.logout=async()=>{ window.permClear(); swrClear(); await sb.auth.signOut(); location.reload(); };

const hasStoredSession=()=>{ try{ return !!localStorage.getItem(AUTH_KEY); }catch(e){ return false; } };
async function boot(){
  $('loginForm').addEventListener('submit',onLogin);
  if(hasStoredSession()){
    /* Token bor — dashboardni DARROV ko'rsatamiz (ekran miltillamasin), sessiyani
       fonda tekshiramiz. Yaroqsiz bo'lsa login ekraniga qaytamiz (reload SHART
       EMAS: login shu sahifaning o'zida). */
    enterApp();
    const {data,error}=await sb.auth.getSession();
    if(error) console.error('getSession xato:',error);
    if(!data||!data.session){
      await sb.auth.signOut().catch(()=>{});
      window.permClear();
      showLogin();
      setErr('Sessiya tugagan. Qaytadan kiring.');
    }
  }else{
    /* Token yo'q — login. getSession() baribir tekshiriladi: boshqa tabda kirgan
       bo'lishi (yoki token endigina yozilgan bo'lishi) mumkin. */
    showLogin();
    const {data}=await sb.auth.getSession();
    if(data&&data.session) enterApp();
  }
}

// boot() ataylab eng oxirida — modul tanasi to'liq baholanib bo'lsin (TDZ:
// yuqorida chaqirilsa pastdagi const/let'lar hali initsializatsiya bo'lmagan bo'ladi).
boot();
</script>
